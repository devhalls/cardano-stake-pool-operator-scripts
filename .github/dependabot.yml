version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    ignore:
      # Local Docker stack is pinned to Ubuntu 24.04 LTS; do not jump major bases.
      - dependency-name: ubuntu
        update-types:
          - "version-update:semver-major"

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    ignore:
      # Pin Ubuntu manually to the current LTS (24.04). Dependabot has no LTS-only
      # filter for Docker tags, so ignore all ubuntu bumps (majors and interims like 24.10).
      - dependency-name: ubuntu

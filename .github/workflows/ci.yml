name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: scripts
          severity: error

  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cardano-cli stub deps
        run: |
          sudo apt-get update
          sudo apt-get install -y jq wget curl unzip tar
      - name: Prepare env
        run: cp env.example env
      - name: Run smoke suite
        run: ./scripts/test.sh smoke

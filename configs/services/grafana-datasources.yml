apiVersion: 1

# Grafana 13 exits if a provisioned uid does not match grafana.db
# (https://github.com/grafana/grafana/issues/110740). Match by name only.
# CSV is not provisioned: a missing plugin type is also fatal on 13.
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://__PROMETHEUS_SCRAPER_HOST__:__PROMETHEUS_SCRAPER_PORT__
    isDefault: true
    editable: true

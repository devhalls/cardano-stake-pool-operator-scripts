apiVersion: 1

# Stable UIDs so grafana-node-dashboard.json can use ${DS_PROMETHEUS} / ${DS_CSV}
# on every host. Grafana creates these on start; existing datasources with the
# same uid are updated, not duplicated.
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://__PROMETHEUS_SCRAPER_HOST__:__PROMETHEUS_SCRAPER_PORT__
    isDefault: true
    editable: true

  - name: CSV
    type: marcusolsson-csv-datasource
    uid: csv-slots
    access: proxy
    url: file:///usr/share/grafana/slots.csv
    editable: true

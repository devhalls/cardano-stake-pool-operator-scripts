    static_configs:
      - targets: [ 'localhost:__MITHRIL_METRICS_SERVER_PORT__' ]

  - job_name: 'prometheus'
    # PROMETHEUS_SCRAPER_TARGETS: alias:type@host:port,...
    static_configs:
__PROMETHEUS_SCRAPER_TARGETS__
